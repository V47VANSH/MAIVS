[package]
name = "aigvs_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "aigvs_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
ndarray = { version = "0.15", features = ["rayon"] }
rayon = "1.8"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"