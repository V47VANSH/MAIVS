[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "aigvs"
version = "0.3.0"
description = "Partitioned vector index in Rust with Python bindings"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Vansh Bansal", email = "v47vansh@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
bench = ["faiss-cpu", "torch", "transformers", "datasets", "usearch"]

[tool.maturin]
module-name = "aigvs"
